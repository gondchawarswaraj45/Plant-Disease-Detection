<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant AI | Crop Health Diagnostics Console</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- React & ReactDOM (CDN) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel Standalone (CDN) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

<div id="root">
    <!-- React will mount here -->
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0b0f17; color: #fff; font-family: 'Outfit', sans-serif;">
        <div style="text-align: center;">
            <span style="font-size: 3rem; animation: spin 2s linear infinite;">🌿</span>
            <h2 style="margin-top: 15px; font-weight: 500;">Loading Plant AI Console...</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Initializing React engine and models</p>
        </div>
    </div>
</div>

<style>
    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<!-- React Application Script -->
<script type="text/babel" data-presets="react" src="{{ url_for('static', filename='app.jsx') }}"></script>

</body>
</html>
